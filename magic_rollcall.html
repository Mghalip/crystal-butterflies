<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crystal Butterflies & 3D Particles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(circle at 50% 48%, #10111a 0%, #050508 72%, #020204 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      color: #f3f4f6; user-select: none; -webkit-font-smoothing: antialiased;
    }

    #webcam-wrap {
      position: fixed; top: 64px; right: 16px; z-index: 8;
      width: 148px; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(8, 9, 14, 0.8);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    #webcam-wrap.visible { opacity: 1; }
    #webcam-wrap.fullscreen-bg {
      top: 0; right: 0; inset: 0; width: 100%; height: 100%;
      aspect-ratio: auto; border-radius: 0; border: none; box-shadow: none; z-index: 1;
    }
    #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }

    #canvas-container { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; cursor: grab; }
    #canvas-container:active { cursor: grabbing; }

    .top-bar {
      position: fixed; top: 14px; left: 14px; right: 14px; z-index: 12;
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; pointer-events: none; flex-wrap: wrap;
    }
    .status-group {
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 13px; border-radius: 999px;
      background: rgba(15, 16, 24, 0.58); border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      font-size: 12px; color: rgba(255, 255, 255, 0.84); pointer-events: auto;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #6b7280; flex-shrink: 0; transition: all 0.25s ease; }
    .status-dot.active { background: #4ade80; box-shadow: 0 0 10px rgba(74, 222, 128, 0.85); }
    .status-dot.tracking { background: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.85); }

    .mode-switch {
      display: inline-flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px;
      background: rgba(15, 16, 24, 0.65); border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); pointer-events: auto;
    }
    .mode-btn {
      border: none; background: transparent; color: rgba(255, 255, 255, 0.72);
      font-size: 12px; font-weight: 500; padding: 6px 13px; border-radius: 999px;
      cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
    }
    .mode-btn:hover { color: #fff; }
    .mode-btn.active { background: rgba(255, 255, 255, 0.92); color: #0b0d17; font-weight: 600; }

    .top-actions { display: inline-flex; align-items: center; gap: 8px; pointer-events: auto; }
    .cam-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(255, 255, 255, 0.1);
      color: #fff; font-size: 12px; font-weight: 500; cursor: pointer;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: all 0.2s ease; white-space: nowrap;
    }
    .cam-btn:hover { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.36); }
    .cam-btn.on { background: rgba(56, 189, 248, 0.22); border-color: rgba(56, 189, 248, 0.55); color: #e0f2fe; }
    .cam-btn:disabled { opacity: 0.55; cursor: wait; }

    .icon-btn {
      width: 33px; height: 33px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(15, 16, 24, 0.52); color: #fff; cursor: pointer;
      display: grid; place-items: center; font-size: 14px; backdrop-filter: blur(12px);
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.18); }
    .hidden { display: none !important; }

    .dock-wrapper {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 12;
      display: flex; flex-direction: column; align-items: center; gap: 9px; max-width: calc(100vw - 20px);
    }
    .color-popover {
      display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 999px;
      background: rgba(16, 17, 26, 0.86); border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(18px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      opacity: 0; transform: translateY(8px); pointer-events: none; transition: all 0.2s ease;
    }
    .color-popover.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .preset-dot {
      width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.25);
      cursor: pointer; transition: transform 0.18s ease, border-color 0.18s ease;
    }
    .preset-dot:hover { transform: scale(1.16); border-color: #fff; }
    .custom-color-label {
      display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: rgba(255, 255, 255, 0.78);
      padding-left: 8px; border-left: 1px solid rgba(255, 255, 255, 0.14); cursor: pointer;
    }
    #color-picker { width: 22px; height: 22px; border: none; background: transparent; cursor: pointer; }

    .dock {
      display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 999px;
      background: rgba(18, 19, 28, 0.7); border: 1px solid rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55); overflow-x: auto; max-width: 100%; scrollbar-width: none;
    }
    .dock::-webkit-scrollbar { display: none; }
    .shape-btn {
      border: none; background: transparent; color: rgba(255, 255, 255, 0.68);
      font-size: 12px; font-weight: 500; padding: 8px 13px; border-radius: 999px;
      cursor: pointer; white-space: nowrap; transition: all 0.22s ease;
    }
    .shape-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
    .shape-btn.active { background: rgba(165, 198, 255, 0.94); color: #0b0d17; font-weight: 600; box-shadow: 0 0 18px rgba(165, 198, 255, 0.45); }
    .dock-divider { width: 1px; height: 18px; background: rgba(255, 255, 255, 0.14); margin: 0 4px; flex-shrink: 0; }
    .color-trigger {
      width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.75);
      background: #f5d08a; cursor: pointer; flex-shrink: 0; margin-right: 4px; box-shadow: 0 0 12px rgba(245, 208, 138, 0.45);
    }
    .manual-bar {
      display: flex; align-items: center; gap: 10px; font-size: 11px; color: rgba(255, 255, 255, 0.62);
      padding: 4px 12px; border-radius: 999px; background: rgba(15, 16, 24, 0.44);
      border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px);
    }
    .manual-bar input[type="range"] { width: 108px; accent-color: #a5c6ff; cursor: pointer; height: 4px; }

    .butterfly-hint {
      display: flex; align-items: center; gap: 14px; padding: 8px 18px; border-radius: 999px;
      background: rgba(14, 14, 24, 0.45); border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px); font-size: 12px; color: rgba(255, 255, 255, 0.85); white-space: nowrap;
    }

    #toast {
      position: fixed; top: 66px; left: 50%; transform: translateX(-50%) translateY(-8px); z-index: 20;
      padding: 8px 16px; border-radius: 999px; background: rgba(24, 24, 36, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.16); color: #fde68a; font-size: 12px;
      opacity: 0; pointer-events: none; transition: all 0.25s ease; max-width: 90vw; text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 640px) {
      .dock-wrapper { width: 95vw; }
      .dock, .butterfly-hint { justify-content: center; flex-wrap: wrap; gap: 5px 10px; border-radius: 14px; }
      .status-group { order: 3; width: 100%; justify-content: center; }
      .shape-btn { padding: 7px 10px; font-size: 11px; }
      #webcam-wrap:not(.fullscreen-bg) { top: 106px; width: 108px; }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="webcam-wrap">
    <video id="webcam" autoplay playsinline muted></video>
  </div>
  <div id="canvas-container"></div>

  <div class="top-bar">
    <div class="status-group">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-label">Drag to rotate, or start your camera to use hand gestures.</span>
    </div>

    <div class="mode-switch" role="tablist" aria-label="Choose an experience">
      <button id="mode-particles" class="mode-btn active" type="button">✨ 3D Particles</button>
      <button id="mode-butterfly" class="mode-btn" type="button">🦋 Crystal Butterflies</button>
    </div>

    <div class="top-actions">
      <button id="mute-btn" class="icon-btn hidden" type="button" title="Toggle butterfly sounds">🔊</button>
      <button id="cam-btn" class="cam-btn" type="button">
        <span>📷</span>
        <span id="cam-btn-text">Start camera</span>
      </button>
    </div>
  </div>

  <div id="toast"></div>

  <div id="particle-dock" class="dock-wrapper">
    <div id="color-popover" class="color-popover">
      <button class="preset-dot" type="button" data-color="#f5d08a" style="background:#f5d08a" title="Sand gold"></button>
      <button class="preset-dot" type="button" data-color="#ff7eb9" style="background:#ff7eb9" title="Cherry blossom pink"></button>
      <button class="preset-dot" type="button" data-color="#60c8ff" style="background:#60c8ff" title="Starlight blue"></button>
      <button class="preset-dot" type="button" data-color="#c084fc" style="background:#c084fc" title="Dream violet"></button>
      <button class="preset-dot" type="button" data-color="#5eead4" style="background:#5eead4" title="Jade green"></button>
      <label class="custom-color-label">
        Custom
        <input id="color-picker" type="color" value="#f5d08a" />
      </label>
    </div>

    <div class="dock" role="toolbar" aria-label="Particle shapes and colors">
      <button class="shape-btn" type="button" data-shape="heart">Heart</button>
      <button class="shape-btn active" type="button" data-shape="saturn">Saturn</button>
      <button class="shape-btn" type="button" data-shape="flower">Flower</button>
      <button class="shape-btn" type="button" data-shape="buddha">Buddha</button>
      <button class="shape-btn" type="button" data-shape="fireworks">Fireworks</button>
      <div class="dock-divider"></div>
      <button id="color-trigger" class="color-trigger" type="button" title="Choose a particle color"></button>
    </div>

    <div id="manual-bar" class="manual-bar">
      <span>Spread / Zoom</span>
      <input id="expansion-slider" type="range" min="0" max="100" value="25" />
    </div>
  </div>

  <div id="butterfly-dock" class="dock-wrapper hidden">
    <div class="butterfly-hint">
      <span>✋ Open palm to release</span>
      <span>✊ Make a fist to gather</span>
      <span>👌 Pinch to summon a giant butterfly</span>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const container = document.getElementById('canvas-container');
      const webcamWrap = document.getElementById('webcam-wrap');
      const videoEl = document.getElementById('webcam');
      const statusDot = document.getElementById('status-dot');
      const statusLabel = document.getElementById('status-label');
      const camBtn = document.getElementById('cam-btn');
      const camBtnText = document.getElementById('cam-btn-text');
      const muteBtn = document.getElementById('mute-btn');
      const modeParticlesBtn = document.getElementById('mode-particles');
      const modeButterflyBtn = document.getElementById('mode-butterfly');
      const particleDock = document.getElementById('particle-dock');
      const butterflyDock = document.getElementById('butterfly-dock');
      const colorTrigger = document.getElementById('color-trigger');
      const colorPopover = document.getElementById('color-popover');
      const colorPicker = document.getElementById('color-picker');
      const expansionSlider = document.getElementById('expansion-slider');
      const manualBar = document.getElementById('manual-bar');
      const toastEl = document.getElementById('toast');
      const shapeBtns = Array.from(document.querySelectorAll('.shape-btn'));
      const presetDots = Array.from(document.querySelectorAll('.preset-dot'));

      let currentMode = 'particles';
      let toastTimer = null;
      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3600);
      }

      class SoundEngine {
        constructor() {
          this.ctx = null; this.masterGain = null; this.delayNode = null;
          this.muted = false; this.lastNoteTime = 0; this.lastGatherTime = 0;
          this.scale = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.51, 1567.98];
        }
        init() {
          if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          this.ctx = new AudioCtx();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = 0.28;
          this.masterGain.connect(this.ctx.destination);
          this.delayNode = this.ctx.createDelay(1.0);
          this.delayNode.delayTime.value = 0.28;
          const feedback = this.ctx.createGain(); feedback.gain.value = 0.32;
          const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 2600;
          this.delayNode.connect(filter); filter.connect(feedback); feedback.connect(this.delayNode);
          filter.connect(this.masterGain);
        }
        setMuted(m) {
          this.muted = m;
          if (this.masterGain && this.ctx) this.masterGain.gain.setTargetAtTime(m ? 0 : 0.28, this.ctx.currentTime, 0.05);
        }
        playFlutterNote() {
          if (!this.ctx || this.muted) return;
          const now = this.ctx.currentTime;
          if (now - this.lastNoteTime < 0.15) return;
          this.lastNoteTime = now;
          const freq = this.scale[Math.floor(Math.random() * this.scale.length)];
          const osc1 = this.ctx.createOscillator(), osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain(), osc2Gain = this.ctx.createGain();
          osc1.type = 'sine'; osc1.frequency.setValueAtTime(freq, now);
          osc2.type = 'triangle'; osc2.frequency.setValueAtTime(freq * 2, now);
          osc2Gain.gain.value = 0.16;
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.16, now + 0.025);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.15);
          osc1.connect(gain); osc2.connect(osc2Gain); osc2Gain.connect(gain);
          gain.connect(this.masterGain); gain.connect(this.delayNode);
          osc1.start(now); osc2.start(now); osc1.stop(now + 1.2); osc2.stop(now + 1.2);
        }
        playGatherChime() {
          if (!this.ctx || this.muted) return;
          const now = this.ctx.currentTime;
          if (now - this.lastGatherTime < 0.85) return;
          this.lastGatherTime = now;
          [392.0, 523.25, 659.25].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now + idx * 0.06);
            gain.gain.setValueAtTime(0.0001, now + idx * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.08, now + idx * 0.06 + 0.18);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.06 + 1.4);
            osc.connect(gain); gain.connect(this.masterGain); gain.connect(this.delayNode);
            osc.start(now + idx * 0.06); osc.stop(now + idx * 0.06 + 1.45);
          });
        }
        playPinchBloom() {
          if (!this.ctx || this.muted) return;
          const now = this.ctx.currentTime;
          [659.25, 783.99, 1046.5, 1318.51, 1567.98].forEach((freq, i) => {
            const t = now + i * 0.055;
            const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(0.14, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
            osc.connect(gain); gain.connect(this.masterGain); gain.connect(this.delayNode);
            osc.start(t); osc.stop(t + 1.55);
          });
        }
      }

      const sound = new SoundEngine();
      muteBtn.addEventListener('click', () => {
        sound.init();
        sound.setMuted(!sound.muted);
        muteBtn.textContent = sound.muted ? '🔇' : '🔊';
      });

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 120);
      camera.position.set(0, 0.5, 13.5);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 1.3));
      const dirLight = new THREE.DirectionalLight(0xfff4ff, 1.0);
      dirLight.position.set(3, 5, 8);
      scene.add(dirLight);

      const particleRoot = new THREE.Group();
      const butterflyRoot = new THREE.Group();
      butterflyRoot.visible = false;
      scene.add(particleRoot, butterflyRoot);

      const PARTICLE_COUNT = 10000;
      function createGlowTexture() {
        const size = 64, c = document.createElement('canvas'); c.width = size; c.height = size;
        const ctx = c.getContext('2d');
        const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
        g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.24, 'rgba(255,250,235,0.85)');
        g.addColorStop(0.55, 'rgba(255,235,200,0.22)'); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
        return new THREE.CanvasTexture(c);
      }

      function buildHeartTargets(count) {
        const arr = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
          const t = Math.random() * Math.PI * 2, u = (Math.random() - 0.5) * 2;
          const shell = 0.65 + Math.pow(Math.random(), 0.45) * 0.35;
          const x = 16 * Math.pow(Math.sin(t), 3) * 0.22 * shell;
          const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 0.22 * shell + 0.3;
          const depth = Math.sqrt(Math.max(0.05, 1 - Math.abs(u))) * (1.55 - Math.abs(x) * 0.22);
          arr[i * 3] = x; arr[i * 3 + 1] = y; arr[i * 3 + 2] = u * depth * shell;
        }
        return arr;
      }

      function buildSaturnTargets(count) {
        const arr = new Float32Array(count * 3);
        const coreCount = Math.floor(count * 0.44), cosT = Math.cos(0.44), sinT = Math.sin(0.44);
        for (let i = 0; i < count; i++) {
          let x, y, z;
          if (i < coreCount) {
            const phi = Math.acos(1 - 2 * Math.random()), theta = Math.random() * Math.PI * 2;
            const r = 2.05 * (0.88 + Math.random() * 0.14);
            x = r * Math.sin(phi) * Math.cos(theta); y = r * Math.cos(phi) * 0.92; z = r * Math.sin(phi) * Math.sin(theta);
          } else {
            const r = Math.random() < 0.55 ? 2.85 + Math.random() * 1.15 : 4.28 + Math.random() * 1.15;
            const theta = Math.random() * Math.PI * 2;
            x = Math.cos(theta) * r; y = (Math.random() - 0.5) * 0.14; z = Math.sin(theta) * r;
          }
          arr[i * 3] = x; arr[i * 3 + 1] = y * cosT - z * sinT; arr[i * 3 + 2] = y * sinT + z * cosT;
        }
        return arr;
      }

      function buildFlowerTargets(count) {
        const arr = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
          if (i < count * 0.18) {
            const phi = Math.acos(1 - 2 * Math.random()), theta = Math.random() * Math.PI * 2, r = 0.85 * Math.cbrt(Math.random());
            arr[i * 3] = r * Math.sin(phi) * Math.cos(theta); arr[i * 3 + 1] = r * Math.cos(phi) * 0.65 + 0.35; arr[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
          } else {
            const layer = i % 3, angle = Math.random() * Math.PI * 2;
            const petalWave = Math.pow(Math.abs(Math.cos(angle * 3 + layer * 0.52)), 0.72);
            const u = Math.pow(Math.random(), 0.65), r = u * (2.2 + layer * 1.05) * (0.35 + 0.65 * petalWave);
            arr[i * 3] = Math.cos(angle) * r;
            arr[i * 3 + 1] = Math.sin(u * Math.PI * 0.85) * (1.25 - layer * 0.25) - 0.55 + layer * 0.22 + (Math.random() - 0.5) * 0.12;
            arr[i * 3 + 2] = Math.sin(angle) * r;
          }
        }
        return arr;
      }

      function buildBuddhaTargets(count) {
        const arr = new Float32Array(count * 3);
        function sampleEllipsoid(cx, cy, cz, rx, ry, rz) {
          const theta = Math.random() * 2 * Math.PI, phi = Math.acos(2 * Math.random() - 1);
          const s = 0.78 + Math.pow(Math.random(), 0.45) * 0.22;
          return [cx + rx * s * Math.sin(phi) * Math.cos(theta), cy + ry * s * Math.cos(phi), cz + rz * s * Math.sin(phi) * Math.sin(theta)];
        }
        for (let i = 0; i < count; i++) {
          const p = Math.random(); let pt;
          if (p < 0.16) {
            const a = Math.random() * Math.PI * 2, r = 1.9 + Math.sin(a * 12) * 0.18 + Math.random() * 0.55;
            pt = [Math.cos(a) * r, -2.55 + (Math.random() - 0.5) * 0.42, Math.sin(a) * r * 0.75];

          if (typeof window.Hands === 'undefined') throw new Error('Hand tracking could not load. Check your connection and reload.');
          let stream;
          try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
          catch (_) { stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); }
          mediaStream = stream; videoEl.srcObject = stream; await videoEl.play();
          if (!handsInstance) {
            handsInstance = new window.Hands({ locateFile: (file) => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + file });
            handsInstance.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.62, minTrackingConfidence: 0.58 });
            handsInstance.onResults(onHandsResults);
          }
          cameraActive = true; webcamWrap.classList.add('visible');
          camBtn.classList.add('on'); camBtnText.textContent = 'Stop camera';
          statusDot.className = 'status-dot active'; manualBar.style.opacity = '0.45';
          let busy = false;
          async function detectLoop() {
            if (!cameraActive) return;
            if (videoEl.readyState >= 2 && !busy) { busy = true; try { await handsInstance.send({ image: videoEl }); } catch (_) {} busy = false; }
            requestAnimationFrame(detectLoop);
          }
          detectLoop();
        } catch (err) {
          showToast(err && err.message ? err.message : 'Camera unavailable. Check your browser permissions.');
          stopCamera();
        } finally { camBtn.disabled = false; }
      }

      camBtn.addEventListener('click', toggleCamera);

      let lastTime = performance.now(), elapsed = 0;
      function animate(now) {
        requestAnimationFrame(animate);
        const dt = Math.min(0.05, (now - lastTime) / 1000); lastTime = now; elapsed += dt;

        if (currentMode === 'particles') {
          currentExpansion += (targetExpansion - currentExpansion) * Math.min(1, dt * 6.5);
          currentScale += (targetScale - currentScale) * Math.min(1, dt * 5.8);
          if (!isDragging) targetRotY += dt * (currentShape === 'fireworks' ? 0.14 : 0.22);
          rotY += (targetRotY - rotY) * Math.min(1, dt * 7);
          rotX += (targetRotX - rotX) * Math.min(1, dt * 7);
          particleCloud.rotation.y = rotY; particleCloud.rotation.x = rotX;
          pMat.size = 0.125 + currentExpansion * 0.065;

          const targetArr = SHAPE_TARGETS[currentShape], posArr = pGeo.attributes.position.array;
          const morphRate = Math.min(1, dt * 4.8), explodeFactor = Math.pow(currentExpansion, 1.35) * 3.1;
          const fwPulse = currentShape === 'fireworks' ? (0.88 + Math.sin(elapsed * 1.9) * 0.18) : 1.0;

          for (let i = 0; i < PARTICLE_COUNT; i++) {
            const i3 = i * 3, shimmer = Math.sin(elapsed * 1.8 + pPhases[i]) * (0.045 + currentExpansion * 0.11);
            posArr[i3] += (targetArr[i3] * currentScale * fwPulse + pScatter[i3] * explodeFactor + shimmer - posArr[i3]) * morphRate;
            posArr[i3 + 1] += (targetArr[i3 + 1] * currentScale * fwPulse + pScatter[i3 + 1] * explodeFactor + Math.cos(elapsed * 1.5 + pPhases[i]) * 0.04 - posArr[i3 + 1]) * morphRate;
            posArr[i3 + 2] += (targetArr[i3 + 2] * currentScale * fwPulse + pScatter[i3 + 2] * explodeFactor - posArr[i3 + 2]) * morphRate;
          }
          pGeo.attributes.position.needsUpdate = true;
        } else {
          const gatherTargets = [], activePinchSlots = new Set();
          bfHandStates.forEach((hand, idx) => {
            if (idx > 1) return;
            if (hand.gesture === 'open') {
              spawnCooldowns[idx] -= dt;
              if (spawnCooldowns[idx] <= 0 && butterflies.length < MAX_BUTTERFLIES) {
                spawnCooldowns[idx] = 0.18;
                const theme = THEME_CYCLE[themeIdx++ % THEME_CYCLE.length];
                butterflies.push(new CrystalButterfly({
                  theme, position: hand.worldPos.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.9, (Math.random() - 0.5) * 0.7, (Math.random() - 0.5) * 0.5)),
                  scale: 0.45 + Math.random() * 0.32, isHero: false
                }));
                sound.playFlutterNote();
              }
            } else if (hand.gesture === 'fist') {
              gatherTargets.push(hand.worldPos);
              if (butterflies.length > 0) sound.playGatherChime();
            } else if (hand.gesture === 'pinch') {
              activePinchSlots.add(idx);
              if (!heroButterflies[idx]) {
                const hero = new CrystalButterfly({ theme: 'prismatic', position: hand.worldPos.clone(), scale: 1.38, isHero: true });
                heroButterflies[idx] = hero; butterflies.push(hero); sound.playPinchBloom();
              } else heroButterflies[idx].group.position.lerp(hand.worldPos.clone().add(new THREE.Vector3(0, 0.22, 0.35)), Math.min(1, dt * 10));
            }
          });
          for (let i = 0; i < 2; i++) {
            if (heroButterflies[i] && !activePinchSlots.has(i)) {
              heroButterflies[i].releasedHero = true; heroButterflies[i].age = 0; heroButterflies[i].maxAge = 8.5;
              heroButterflies[i].velocity.set((Math.random() - 0.5) * 1.4, 1.15, 0.2); heroButterflies[i] = null;
            }
          }
          if (!cameraActive && butterflies.length === 0) seedDemoButterflies();
          for (let i = butterflies.length - 1; i >= 0; i--) if (!butterflies[i].update(dt, gatherTargets)) butterflies.splice(i, 1);
        }
        renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
      switchMode('butterfly');
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
