<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR 魔法女巫 · 掌心魔法球点名</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0a0814;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      color: #fff; user-select: none;
    }

    /* 全屏原比例真人摄像头背景，人物在画面正中，不拉伸 */
    #webcam {
      position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1); z-index: 1;
      background: #0a0814;
      transition: filter 0.4s ease;
    }

    /* 梦幻紫金魔法滤镜（通透不糊脸） */
    #webcam.magic-filter {
      filter: contrast(1.06) saturate(1.18) brightness(1.04) hue-rotate(-6deg);
    }

    /* 紫金星光边缘柔光罩 */
    #magic-vignette {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background:
        radial-gradient(circle at 50% 45%, rgba(253, 224, 71, 0.04) 0%, rgba(124, 58, 237, 0.14) 68%, rgba(17, 10, 42, 0.56) 100%),
        linear-gradient(180deg, rgba(88, 28, 135, 0.18) 0%, rgba(0, 0, 0, 0) 30%, rgba(30, 14, 62, 0.25) 100%);
      mix-blend-mode: screen;
      transition: opacity 0.4s ease;
    }
    #magic-vignette.off { opacity: 0; }

    /* Three.js 透明 3D 叠加层（3D 女巫帽 + 掌心魔法球 + 魔法星尘） */
    #three-canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 3; pointer-events: none;
    }

    /* 极简启动层 */
    #start-overlay {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 45%, rgba(32, 18, 66, 0.88), rgba(8, 6, 18, 0.96));
      backdrop-filter: blur(12px);
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #start-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .start-title {
      font-size: 28px; font-weight: 500; letter-spacing: 0.14em;
      background: linear-gradient(120deg, #fde68a, #d8b4fe, #7dd3fc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .start-sub {
      font-size: 13px; color: rgba(255, 255, 255, 0.76);
      text-align: center; line-height: 1.9; letter-spacing: 0.04em;
    }
    #start-btn {
      margin-top: 6px; padding: 12px 36px; border-radius: 999px;
      border: 1px solid rgba(253, 224, 71, 0.45);
      background: linear-gradient(120deg, rgba(139, 92, 246, 0.35), rgba(245, 158, 11, 0.28));
      color: #fffbeb; font-size: 15px; letter-spacing: 0.1em; cursor: pointer;
      backdrop-filter: blur(10px); transition: all 0.25s ease;
      box-shadow: 0 0 28px rgba(167, 139, 250, 0.35);
    }
    #start-btn:hover { transform: translateY(-1px); box-shadow: 0 0 36px rgba(253, 224, 71, 0.45); }
    #start-btn:disabled { opacity: 0.55; cursor: wait; }
    #error-msg { font-size: 13px; color: #fda4af; min-height: 18px; text-align: center; padding: 0 20px; }

    /* 极简角落 HUD */
    #hud {
      position: fixed; top: 14px; left: 14px; right: 14px; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; flex-wrap: wrap; pointer-events: none;
      opacity: 0; transition: opacity 0.45s ease;
    }
    #hud.visible { opacity: 1; }

    .pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 13px; border-radius: 999px;
      background: rgba(14, 10, 30, 0.42); border: 1px solid rgba(253, 224, 71, 0.24);
      backdrop-filter: blur(10px); font-size: 12px; color: #fefce8; pointer-events: auto;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80; }
    .dot.spinning { background: #38bdf8; box-shadow: 0 0 10px #38bdf8; }
    .dot.locked { background: #fbbf24; box-shadow: 0 0 10px #fbbf24; }

    .corner-btns { display: flex; gap: 7px; pointer-events: auto; flex-wrap: wrap; }
    .icon-btn {
      height: 34px; padding: 0 12px; border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(14, 10, 30, 0.42); color: #fff;
      font-size: 12px; cursor: pointer; backdrop-filter: blur(10px);
      display: inline-flex; align-items: center; gap: 5px;
      transition: all 0.2s ease; white-space: nowrap;
    }
    .icon-btn:hover { background: rgba(139, 92, 246, 0.32); border-color: rgba(253, 224, 71, 0.5); }
    .icon-btn.active { border-color: rgba(253, 224, 71, 0.6); color: #fef08a; }

    /* 底部极细提示 */
    #hint-bar {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: flex; gap: 14px; padding: 6px 16px; border-radius: 999px;
      background: rgba(14, 10, 30, 0.36); border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(10px); font-size: 12px; color: rgba(255, 255, 255, 0.86);
      pointer-events: none; opacity: 0; transition: opacity 0.45s ease; white-space: nowrap;
    }
    #hint-bar.visible { opacity: 1; }

    /* 名单弹窗 */
    #roster-modal {
      position: fixed; inset: 0; z-index: 30;
      display: flex; align-items: center; justify-content: center; padding: 18px;
      background: rgba(6, 5, 16, 0.7); backdrop-filter: blur(10px);
      opacity: 0; visibility: hidden; pointer-events: none; transition: all 0.25s ease;
    }
    #roster-modal.open { opacity: 1; visibility: visible; pointer-events: auto; }
    .modal-card {
      width: 100%; max-width: 440px; border-radius: 20px; padding: 20px;
      background: rgba(20, 16, 40, 0.96); border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
      display: flex; flex-direction: column; gap: 12px;
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 16px; font-weight: 600; }
    .close-x { width: 28px; height: 28px; border-radius: 50%; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 16px; cursor: pointer; }
    .modal-desc { font-size: 12px; color: rgba(255,255,255,0.68); line-height: 1.5; }
    #roster-textarea {
      width: 100%; height: 170px; padding: 10px 12px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2); background: rgba(8,8,18,0.85);
      color: #fff; font-size: 14px; line-height: 1.6; resize: vertical; outline: none; font-family: inherit;
    }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
    .history-box { font-size: 12px; color: rgba(255,255,255,0.75); max-height: 62px; overflow-y: auto; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.06); }
    .modal-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .save-btn { border: none; padding: 8px 18px; border-radius: 999px; background: linear-gradient(120deg, #a78bfa, #fde68a); color: #090817; font-weight: 600; font-size: 13px; cursor: pointer; }
  </style>

  <!-- Three.js + MediaPipe Hands + MediaPipe FaceMesh -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
  <video id="webcam" class="magic-filter" autoplay playsinline muted></video>
  <div id="magic-vignette"></div>
  <canvas id="three-canvas"></canvas>

  <div id="start-overlay">
    <div class="start-title">🧙‍♀️ 实时 3D 女巫 · 掌心魔法球</div>
    <div class="start-sub">
      实时为你戴上跟随转头歪头的 3D 星空女巫帽与紫金魔法光晕<br />
      ✋ 摊开/水平托掌：学生姓名在掌心高速旋转<br />
      ✊ 握紧拳头：星光定格，揭晓被点中的同学
    </div>
    <button id="start-btn">开启魔法摄像头</button>
    <div id="error-msg"></div>
  </div>

  <div id="hud">
    <div class="pill">
      <span id="status-dot" class="dot"></span>
      <span id="status-text">请摊开手掌召唤魔法球</span>
      <span id="counter-text" style="opacity:0.78;margin-left:4px;">· 0/24</span>
    </div>
    <div class="corner-btns">
      <button id="hat-btn" class="icon-btn active" type="button">🧙‍♀️ 女巫帽</button>
      <button id="filter-btn" class="icon-btn active" type="button">✨ 紫金滤镜</button>
      <button id="roster-btn" class="icon-btn" type="button">📋 名单</button>
      <button id="mute-btn" class="icon-btn" type="button" title="开关音效">🔊</button>
    </div>
  </div>

  <div id="hint-bar">
    <span>🧙‍♀️ 头部实时佩戴 3D 女巫帽</span>
    <span>✋ 摊掌/托掌：旋转点名</span>
    <span>✊ 握拳：定格揭晓</span>
  </div>

  <div id="roster-modal">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title">学生名单</div>
        <button id="close-modal-btn" class="close-x" type="button">×</button>
      </div>
      <div class="modal-desc">每行输入一个学生姓名（也支持逗号、顿号或空格分隔），保存后立即更新到掌心魔法球。</div>
      <textarea id="roster-textarea"></textarea>
      <label class="toggle-row">
        <span>不重复点名（全班点完自动重置）</span>
        <input id="no-repeat-check" type="checkbox" checked />
      </label>
      <div id="history-box" class="history-box">已点记录：暂无</div>
      <div class="modal-footer">
        <button id="reset-picked-btn" class="icon-btn" type="button">重置已点</button>
        <button id="save-roster-btn" class="save-btn" type="button">保存名单</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const DEFAULT_STUDENTS = Array.from({ length: 24 }, (_, i) => '同学' + String(i + 1).padStart(2, '0'));

      let students = [];
      let pickedList = [];
      let noRepeat = true;

      try {
        const saved = localStorage.getItem('magic_rollcall_students');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) students = parsed;
        }
      } catch (_) {}
      if (students.length === 0) students = DEFAULT_STUDENTS.slice();

      const videoEl = document.getElementById('webcam');
      const magicVignette = document.getElementById('magic-vignette');
      const canvasEl = document.getElementById('three-canvas');
      const startOverlay = document.getElementById('start-overlay');
      const startBtn = document.getElementById('start-btn');
      const errorMsg = document.getElementById('error-msg');
      const hudEl = document.getElementById('hud');
      const hintBar = document.getElementById('hint-bar');
      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');
      const counterText = document.getElementById('counter-text');
      const hatBtn = document.getElementById('hat-btn');
      const filterBtn = document.getElementById('filter-btn');
      const rosterBtn = document.getElementById('roster-btn');
      const muteBtn = document.getElementById('mute-btn');
      const rosterModal = document.getElementById('roster-modal');
      const closeModalBtn = document.getElementById('close-modal-btn');
      const rosterTextarea = document.getElementById('roster-textarea');
      const noRepeatCheck = document.getElementById('no-repeat-check');
      const historyBox = document.getElementById('history-box');
      const resetPickedBtn = document.getElementById('reset-picked-btn');
      const saveRosterBtn = document.getElementById('save-roster-btn');

      let showHat = true;
      let filterOn = true;

      hatBtn.addEventListener('click', () => {
        showHat = !showHat;
        hatBtn.classList.toggle('active', showHat);
        hatAnchor.visible = showHat;
      });

      filterBtn.addEventListener('click', () => {
        filterOn = !filterOn;
        filterBtn.classList.toggle('active', filterOn);
        videoEl.classList.toggle('magic-filter', filterOn);
        magicVignette.classList.toggle('off', !filterOn);
      });

      function updateCounter() {
        counterText.textContent = '· ' + pickedList.length + '/' + students.length;
        historyBox.textContent = pickedList.length ? '已点记录：' + pickedList.join('、') : '已点记录：暂无';
      }
      updateCounter();

      // ==================== 魔法音效 ====================
      class MagicAudio {
        constructor() { this.ctx = null; this.muted = false; this.lastTick = 0; }
        init() {
          if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        playTick() {
          if (!this.ctx || this.muted) return;
          const now = this.ctx.currentTime;
          if (now - this.lastTick < 0.095) return;
          this.lastTick = now;
          const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(740 + Math.random() * 520, now);
          g.gain.setValueAtTime(0.0001, now);
          g.gain.exponentialRampToValueAtTime(0.04, now + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
          osc.connect(g); g.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.11);
        }
        playReveal() {
          if (!this.ctx || this.muted) return;
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((freq, i) => {
            const t = now + i * 0.05;
            const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, t);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.11, t + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
            osc.connect(g); g.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 1.15);
          });
        }
      }
      const magicAudio = new MagicAudio();
      muteBtn.addEventListener('click', () => {
        magicAudio.init();
        magicAudio.muted = !magicAudio.muted;
        muteBtn.textContent = magicAudio.muted ? '🔇' : '🔊';
      });

      // ==================== Three.js 场景搭建 ====================
      const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, alpha: true, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 10);

      // 柔美紫金三点光，让 3D 女巫帽呈现丝绒立体光泽
      scene.add(new THREE.AmbientLight(0xd8b4fe, 0.95));
      const keyLight = new THREE.DirectionalLight(0xfff4d6, 1.35);
      keyLight.position.set(2.5, 5, 6);
      scene.add(keyLight);
      const rimLight = new THREE.DirectionalLight(0x818cf8, 1.1);
      rimLight.position.set(-4, 2, -2);
      scene.add(rimLight);

      function createGlowTex(innerColor, midColor) {
        const c = document.createElement('canvas'); c.width = 64; c.height = 64;
        const ctx = c.getContext('2d');
        const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        g.addColorStop(0, innerColor); g.addColorStop(0.32, midColor); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(c);
      }
      const starTex = createGlowTex('rgba(255,255,255,1)', 'rgba(196,181,253,0.75)');
      const orbAuraTex = createGlowTex('rgba(254,240,138,0.65)', 'rgba(139,92,246,0.4)');

      // ==================== 1. 全屏飘浮紫金魔法星尘 ====================
      const AMBIENT_N = 110;
      const ambPos = new Float32Array(AMBIENT_N * 3);
      const ambCol = new Float32Array(AMBIENT_N * 3);
      const ambSpeed = new Float32Array(AMBIENT_N);
      const colGold = new THREE.Color('#fde68a'), colViolet = new THREE.Color('#c084fc');
      for (let i = 0; i < AMBIENT_N; i++) {
        ambPos[i * 3] = (Math.random() - 0.5) * 14;
        ambPos[i * 3 + 1] = (Math.random() - 0.5) * 8;
        ambPos[i * 3 + 2] = (Math.random() - 0.5) * 2 - 1;
        ambSpeed[i] = 0.15 + Math.random() * 0.35;
        const c = Math.random() < 0.55 ? colGold : colViolet;
        ambCol[i * 3] = c.r; ambCol[i * 3 + 1] = c.g; ambCol[i * 3 + 2] = c.b;
      }
      const ambGeo = new THREE.BufferGeometry();
      ambGeo.setAttribute('position', new THREE.BufferAttribute(ambPos, 3));
      ambGeo.setAttribute('color', new THREE.BufferAttribute(ambCol, 3));
      scene.add(new THREE.Points(ambGeo, new THREE.PointsMaterial({
        size: 0.15, map: starTex, vertexColors: true, transparent: true, opacity: 0.72, depthWrite: false, blending: THREE.AdditiveBlending
      })));

      // ==================== 2. 实时 3D 星空女巫尖顶帽 ====================
      function createStarryVelvetTexture() {
        const c = document.createElement('canvas'); c.width = 512; c.height = 512;
        const ctx = c.getContext('2d');
        const g = ctx.createLinearGradient(0, 0, 0, 512);
        g.addColorStop(0, '#312e81');
        g.addColorStop(0.5, '#1e1b4b');
        g.addColorStop(1, '#110d2b');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 512, 512);

        // 金色小星星与星芒
        for (let i = 0; i < 65; i++) {
          const x = Math.random() * 512, y = Math.random() * 512;
          const r = 1.2 + Math.random() * 3.2;
          ctx.fillStyle = Math.random() < 0.75 ? '#fde68a' : '#e9d5ff';
          ctx.globalAlpha = 0.55 + Math.random() * 0.45;
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        }
        // 金色小弯月纹样
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = '#fcd34d';
        for (let i = 0; i < 10; i++) {
          const x = 30 + Math.random() * 450, y = 40 + Math.random() * 420;
          ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#1e1b4b';
          ctx.beginPath(); ctx.arc(x + 3.5, y - 1.5, 6.8, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fcd34d';
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }

      const hatAnchor = new THREE.Group();
      hatAnchor.scale.setScalar(0.001);
      scene.add(hatAnchor);

      const velvetTex = createStarryVelvetTexture();
      const hatMat = new THREE.MeshStandardMaterial({
        map: velvetTex, roughness: 0.72, metalness: 0.18, side: THREE.DoubleSide
      });
      const goldMat = new THREE.MeshStandardMaterial({
        color: 0xfbbf24, emissive: 0x78350f, emissiveIntensity: 0.45, roughness: 0.25, metalness: 0.82
      });

      // 宽大微翘波浪帽檐
      const brimGeo = new THREE.CylinderGeometry(0.68, 1.48, 0.08, 48, 4, true);
      const bAttr = brimGeo.attributes.position;
      for (let i = 0; i < bAttr.count; i++) {
        const x = bAttr.getX(i), y = bAttr.getY(i), z = bAttr.getZ(i);
        const r = Math.hypot(x, z);
        const angle = Math.atan2(z, x);
        // 帽檐外圈轻微自然波浪起伏
        const wave = Math.max(0, (r - 0.7) / 0.8) * (Math.sin(angle * 3) * 0.08 + Math.cos(angle * 2) * 0.05);
        bAttr.setY(i, y + wave);
      }
      brimGeo.computeVertexNormals();
      const brimMesh = new THREE.Mesh(brimGeo, hatMat);
      brimMesh.position.y = 0.05;
      hatAnchor.add(brimMesh);

      // 帽檐外缘金线滚边
      const brimRim = new THREE.Mesh(new THREE.TorusGeometry(1.46, 0.022, 10, 64), goldMat);
      brimRim.rotation.x = Math.PI / 2;
      brimRim.position.y = 0.02;
      hatAnchor.add(brimRim);

      // 俏皮微弯的尖顶帽身
      const coneGeo = new THREE.ConeGeometry(0.74, 2.05, 36, 18);
      coneGeo.translate(0, 1.02, 0);
      const cAttr = coneGeo.attributes.position;
      for (let i = 0; i < cAttr.count; i++) {
        const x = cAttr.getX(i), y = cAttr.getY(i), z = cAttr.getZ(i);
        const t = y / 2.05;
        // 越靠近帽尖越向右后方优雅弯曲
        const bendX = Math.pow(t, 2.15) * 0.58;
        const bendZ = -Math.pow(t, 2.0) * 0.32;
        const droopY = Math.pow(t, 2.6) * 0.28;
        cAttr.setXYZ(i, x + bendX, y - droopY, z + bendZ);
      }
      coneGeo.computeVertexNormals();
      const coneMesh = new THREE.Mesh(coneGeo, hatMat);
      coneMesh.position.y = 0.04;
      hatAnchor.add(coneMesh);

      // 金色缎带帽圈 + 正前方星月徽章
      const bandMesh = new THREE.Mesh(new THREE.TorusGeometry(0.71, 0.055, 12, 48), goldMat);
      bandMesh.rotation.x = Math.PI / 2;
      bandMesh.position.y = 0.14;
      hatAnchor.add(bandMesh);

      // 帽前弯月徽章（弧形环 + 发光星点）
      const moonBadge = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.028, 10, 24, Math.PI * 1.4), goldMat);
      moonBadge.position.set(0, 0.28, 0.72);
      moonBadge.rotation.z = 0.6;
      hatAnchor.add(moonBadge);

      const hatTipGlow = new THREE.Sprite(new THREE.SpriteMaterial({
        map: starTex, color: 0xfef08a, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending
      }));
      hatTipGlow.position.set(0.58, 1.82, -0.32);
      hatTipGlow.scale.set(0.55, 0.55, 1);
      hatAnchor.add(hatTipGlow);

      // ==================== 3. 掌心旋转学生姓名魔法球 ====================
      const handAnchor = new THREE.Group();
      handAnchor.scale.setScalar(0.001);
      scene.add(handAnchor);

      const coreGlow = new THREE.Sprite(new THREE.SpriteMaterial({
        map: orbAuraTex, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending
      }));
      coreGlow.scale.set(3.2, 3.2, 1);
      handAnchor.add(coreGlow);

      const spinGroup = new THREE.Group();
      handAnchor.add(spinGroup);

      const SPARK_COUNT = 500;
      const spPos = new Float32Array(SPARK_COUNT * 3);
      const spCol = new Float32Array(SPARK_COUNT * 3);
      const cA = new THREE.Color('#fde68a'), cB = new THREE.Color('#c4b5fd'), cC = new THREE.Color('#7dd3fc');
      for (let i = 0; i < SPARK_COUNT; i++) {
        const phi = Math.acos(1 - 2 * Math.random()), theta = Math.random() * Math.PI * 2;
        const r = 1.05 + (Math.random() - 0.5) * 0.28;
        spPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        spPos[i * 3 + 1] = r * Math.cos(phi);
        spPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
        const col = i % 3 === 0 ? cA : (i % 3 === 1 ? cB : cC);
        spCol[i * 3] = col.r; spCol[i * 3 + 1] = col.g; spCol[i * 3 + 2] = col.b;
      }
      const spGeo = new THREE.BufferGeometry();
      spGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3));
      spGeo.setAttribute('color', new THREE.BufferAttribute(spCol, 3));
      spinGroup.add(new THREE.Points(spGeo, new THREE.PointsMaterial({
        size: 0.14, map: starTex, vertexColors: true, transparent: true, opacity: 0.88, depthWrite: false, blending: THREE.AdditiveBlending
      })));

      const ring1 = new THREE.Mesh(
        new THREE.TorusGeometry(1.42, 0.016, 10, 80),
        new THREE.MeshBasicMaterial({ color: 0xfde68a, transparent: true, opacity: 0.75 })
      );
      ring1.rotation.x = Math.PI * 0.42;
      const ring2 = new THREE.Mesh(
        new THREE.TorusGeometry(1.62, 0.012, 10, 80),
        new THREE.MeshBasicMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.58 })
      );
      ring2.rotation.x = -Math.PI * 0.36;
      ring2.rotation.y = Math.PI * 0.25;
      handAnchor.add(ring1, ring2);

      const namesGroup = new THREE.Group();
      spinGroup.add(namesGroup);
      let nameSprites = [];

      function createNameTexture(name, isWinner) {
        const c = document.createElement('canvas');
        c.width = isWinner ? 512 : 320;
        c.height = isWinner ? 192 : 112;
        const ctx = c.getContext('2d');
        const padX = 18, padY = 18, w = c.width - padX * 2, h = c.height - padY * 2, r = h / 2;
        ctx.beginPath();
        ctx.moveTo(padX + r, padY);
        ctx.arcTo(padX + w, padY, padX + w, padY + h, r);
        ctx.arcTo(padX + w, padY + h, padX, padY + h, r);
        ctx.arcTo(padX, padY + h, padX, padY, r);
        ctx.arcTo(padX, padY, padX + w, padY, r);
        ctx.closePath();

        if (isWinner) {
          const grad = ctx.createLinearGradient(0, 0, c.width, c.height);
          grad.addColorStop(0, 'rgba(91, 33, 182, 0.94)');
          grad.addColorStop(1, 'rgba(217, 119, 6, 0.94)');
          ctx.fillStyle = grad; ctx.fill();
          ctx.lineWidth = 6; ctx.strokeStyle = '#fef08a'; ctx.stroke();
          ctx.font = '700 66px "PingFang SC", sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = '#fffbeb';
          ctx.shadowColor = 'rgba(253, 224, 71, 0.85)'; ctx.shadowBlur = 18;
          ctx.fillText(name.slice(0, 6), c.width / 2, c.height / 2 + 2);
        } else {
          ctx.fillStyle = 'rgba(20, 14, 48, 0.68)'; ctx.fill();
          ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(221, 214, 254, 0.72)'; ctx.stroke();
          ctx.font = '600 40px "PingFang SC", sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = '#ffffff';
          ctx.fillText(name.slice(0, 6), c.width / 2, c.height / 2 + 2);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.needsUpdate = true;
        return tex;
      }

      function rebuildNameOrb() {
        nameSprites.forEach((it) => {
          namesGroup.remove(it.sprite);
          it.sprite.material.map.dispose();
          it.sprite.material.dispose();
        });
        nameSprites = [];
        const n = students.length, radius = 1.52;
        for (let i = 0; i < n; i++) {
          const y = 1 - (i / Math.max(1, n - 1)) * 2;
          const rAtY = Math.sqrt(Math.max(0, 1 - y * y));
          const theta = Math.PI * (3 - Math.sqrt(5)) * i;
          const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
            map: createNameTexture(students[i], false),
            transparent: true, opacity: 0.96, depthWrite: false
          }));
          sprite.position.set(Math.cos(theta) * rAtY * radius, y * radius, Math.sin(theta) * rAtY * radius);
          sprite.scale.set(0.92, 0.32, 1);
          namesGroup.add(sprite);
          nameSprites.push({ name: students[i], sprite });
        }
      }
      rebuildNameOrb();

      const winnerSprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: createNameTexture(students[0], true),
        transparent: true, opacity: 0, depthWrite: false
      }));
      winnerSprite.position.set(0, 0.1, 1.85);
      winnerSprite.scale.set(2.45, 0.92, 1);
      handAnchor.add(winnerSprite);

      const BURST_N = 90;
      const bPos = new Float32Array(BURST_N * 3);
      const bVel = Array.from({ length: BURST_N }, () => new THREE.Vector3());
      let burstLife = 0;
      const bGeo = new THREE.BufferGeometry();
      bGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
      const bMat = new THREE.PointsMaterial({
        size: 0.18, map: starTex, color: 0xfde68a, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending
      });
      handAnchor.add(new THREE.Points(bGeo, bMat));

      function triggerBurst() {
        burstLife = 1.0;
        for (let i = 0; i < BURST_N; i++) {
          bPos[i * 3] = 0; bPos[i * 3 + 1] = 0; bPos[i * 3 + 2] = 0.5;
          const phi = Math.acos(1 - 2 * Math.random()), theta = Math.random() * Math.PI * 2;
          const spd = 1.8 + Math.random() * 3.4;
          bVel[i].set(Math.sin(phi) * Math.cos(theta) * spd, Math.cos(phi) * spd, Math.sin(phi) * Math.sin(theta) * spd);
        }
        bGeo.attributes.position.needsUpdate = true;
      }

      // ==================== 坐标换算 ====================
      function landmarkToWorld(lm) {
        const vw = window.innerWidth, vh = window.innerHeight;
        const vidW = videoEl.videoWidth || vw, vidH = videoEl.videoHeight || vh;
        const scale = Math.max(vw / vidW, vh / vidH);
        const dispW = vidW * scale, dispH = vidH * scale;
        const px = (1 - lm.x) * dispW - (dispW - vw) / 2;
        const py = lm.y * dispH - (dispH - vh) / 2;
        const halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
        const halfW = halfH * camera.aspect;
        return new THREE.Vector3(((px / vw) * 2 - 1) * halfW, (-(py / vh) * 2 + 1) * halfH, 0);
      }

      // ==================== FaceMesh 3D 女巫帽头部追踪 ====================
      let hatTargetPos = new THREE.Vector3(0, 2, 0);
      let hatTargetScale = 0.001;
      let hatCurrentScale = 0.001;
      let hatTargetRot = new THREE.Euler(0, 0, 0);
      let faceMissingFrames = 0;

      function onFaceResults(results) {
        const faces = results.multiFaceLandmarks || [];
        if (faces.length === 0) {
          faceMissingFrames++;
          if (faceMissingFrames > 15) hatTargetScale = 0.001;
          return;
        }
        faceMissingFrames = 0;
        const lm = faces[0];

        // 10=额头顶部，152=下巴，234=左太阳穴，454=右太阳穴，1=鼻尖
        const topWorld = landmarkToWorld(lm[10]);
        const chinWorld = landmarkToWorld(lm[152]);
        const leftWorld = landmarkToWorld(lm[234]);
        const rightWorld = landmarkToWorld(lm[454]);
        const noseWorld = landmarkToWorld(lm[1]);

        const faceWidth = leftWorld.distanceTo(rightWorld);
        const faceHeight = topWorld.distanceTo(chinWorld);

        // 计算头部歪头角度（roll）
        const dx = rightWorld.x - leftWorld.x;
        const dy = rightWorld.y - leftWorld.y;
        // 因为画面水平镜像，leftWorld 在画面右侧、rightWorld 在画面左侧
        const roll = Math.atan2(leftWorld.y - rightWorld.y, leftWorld.x - rightWorld.x);

        // 计算左右转头（yaw）与抬头低头（pitch）
        const faceCenterX = (leftWorld.x + rightWorld.x) * 0.5;
        const yaw = THREE.MathUtils.clamp(((noseWorld.x - faceCenterX) / (faceWidth * 0.5 || 1)) * 0.85, -0.7, 0.7);
        const faceCenterY = (topWorld.y + chinWorld.y) * 0.5;
        const pitch = THREE.MathUtils.clamp(((noseWorld.y - faceCenterY) / (faceHeight * 0.5 || 1) + 0.06) * 0.55, -0.45, 0.45);

        // 沿着头部向上方向将帽檐自然放在额头上方发际线处
        const upX = -Math.sin(roll);
        const upY = Math.cos(roll);
        hatTargetPos.set(
          topWorld.x + upX * (faceHeight * 0.05),
          topWorld.y + upY * (faceHeight * 0.05),
          0.1
        );
        hatTargetScale = Math.max(0.45, faceWidth * 0.62);
        hatTargetRot.set(-pitch, yaw, roll);
      }

      // ==================== Hands 3D 关节手势识别（支持水平托掌） ====================
      function fingerStraightness3D(lms, mcp, pip, tip) {
        const v1x = lms[pip].x - lms[mcp].x, v1y = lms[pip].y - lms[mcp].y, v1z = (lms[pip].z - lms[mcp].z) * 1.2;
        const v2x = lms[tip].x - lms[pip].x, v2y = lms[tip].y - lms[pip].y, v2z = (lms[tip].z - lms[pip].z) * 1.2;
        return (v1x * v2x + v1y * v2y + v1z * v2z) / ((Math.hypot(v1x, v1y, v1z) || 1e-5) * (Math.hypot(v2x, v2y, v2z) || 1e-5));
      }

      function classifyHand3D(lms) {
        const vals = [
          fingerStraightness3D(lms, 5, 6, 8),
          fingerStraightness3D(lms, 9, 10, 12),
          fingerStraightness3D(lms, 13, 14, 16),
          fingerStraightness3D(lms, 17, 18, 20)
        ];
        let openC = 0, fistC = 0;
        for (let i = 0; i < 4; i++) {
          if (vals[i] > 0.45) openC++;
          if (vals[i] < 0.05) fistC++;
        }
        const palm = { x: (lms[0].x + lms[9].x) * 0.5, y: (lms[0].y + lms[9].y) * 0.5, z: (lms[0].z + lms[9].z) * 0.5 };
        if (openC >= 3) return { gesture: 'open', anchor: palm };
        if (fistC >= 3) return { gesture: 'fist', anchor: palm };
        return { gesture: 'neutral', anchor: palm };
      }

      let state = 'hidden';
      let handTargetPos = new THREE.Vector3(0, 0, 0);
      let handTargetScale = 0.001, handCurrentScale = 0.001;
      let spinSpeedY = 0.4, spinSpeedX = 0.1;
      let winnerOpacityTarget = 0;
      let stableGesture = 'none', stableFrames = 0, handMissingFrames = 0;

      function pickStudent() {
        let pool = noRepeat ? students.filter((n) => !pickedList.includes(n)) : students.slice();
        if (pool.length === 0) { pickedList = []; pool = students.slice(); }
        const chosen = pool[Math.floor(Math.random() * pool.length)];
        if (noRepeat) pickedList.push(chosen);
        updateCounter();

        winnerSprite.material.map.dispose();
        winnerSprite.material.map = createNameTexture(chosen, true);
        winnerSprite.material.needsUpdate = true;
        winnerOpacityTarget = 1;
        triggerBurst();
        magicAudio.playReveal();

        statusDot.className = 'dot locked';
        statusText.textContent = '✊ 魔法选中：' + chosen;
      }

      function onHandsResults(results) {
        const multi = results.multiHandLandmarks || [];
        if (multi.length === 0) {
          handMissingFrames++;
          if (handMissingFrames > 16 && state !== 'locked') {
            handTargetScale = 0.001;
            statusDot.className = 'dot';
            statusText.textContent = '请摊开手掌召唤魔法球';
          }
          return;
        }
        handMissingFrames = 0;

        const info = classifyHand3D(multi[0]);
        const wp = landmarkToWorld(info.anchor);
        handTargetPos.set(wp.x, wp.y + 1.15, 0.2);

        if (info.gesture === stableGesture && info.gesture !== 'neutral') stableFrames++;
        else { stableGesture = info.gesture; stableFrames = 1; }

        if (stableFrames >= 3) {
          if (info.gesture === 'open') {
            if (state !== 'spinning') {
              state = 'spinning';
              winnerOpacityTarget = 0;
              statusDot.className = 'dot spinning';
              statusText.textContent = '✋ 掌心魔法球旋转中 · 握拳定格点名';
            }
            handTargetScale = 1.0;
          } else if (info.gesture === 'fist') {
            if (state === 'spinning') {
              state = 'locked';
              pickStudent();
            }
            if (state === 'locked') handTargetScale = 1.05;
          }
        }
      }

      // 名单弹窗
      rosterBtn.addEventListener('click', () => {
        rosterTextarea.value = students.join('\n');
        noRepeatCheck.checked = noRepeat;
        updateCounter();
        rosterModal.classList.add('open');
      });
      closeModalBtn.addEventListener('click', () => rosterModal.classList.remove('open'));
      resetPickedBtn.addEventListener('click', () => { pickedList = []; updateCounter(); });
      saveRosterBtn.addEventListener('click', () => {
        const list = rosterTextarea.value.split(/[\n,，、\s]+/).map((s) => s.trim()).filter(Boolean);
        if (!list.length) return;
        students = list;
        noRepeat = noRepeatCheck.checked;
        pickedList = pickedList.filter((n) => students.includes(n));
        try { localStorage.setItem('magic_rollcall_students', JSON.stringify(students)); } catch (_) {}
        rebuildNameOrb();
        updateCounter();
        rosterModal.classList.remove('open');
      });

      // ==================== 动画主循环 ====================
      let lastTime = performance.now(), elapsed = 0;
      function animate(now) {
        requestAnimationFrame(animate);
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        elapsed += dt;

        // 1. 3D 女巫帽丝滑贴合头部
        hatAnchor.position.lerp(hatTargetPos, Math.min(1, dt * 14));
        hatCurrentScale += (hatTargetScale - hatCurrentScale) * Math.min(1, dt * 12);
        hatAnchor.scale.setScalar(Math.max(0.001, hatCurrentScale));
        hatAnchor.rotation.x += (hatTargetRot.x - hatAnchor.rotation.x) * Math.min(1, dt * 12);
        hatAnchor.rotation.y += (hatTargetRot.y - hatAnchor.rotation.y) * Math.min(1, dt * 12);
        hatAnchor.rotation.z += (hatTargetRot.z - hatAnchor.rotation.z) * Math.min(1, dt * 12);
        hatTipGlow.material.opacity = 0.65 + Math.sin(elapsed * 4.5) * 0.3;

        // 2. 掌心魔法球丝滑跟随与旋转
        handAnchor.position.lerp(handTargetPos, Math.min(1, dt * 12));
        handCurrentScale += (handTargetScale - handCurrentScale) * Math.min(1, dt * 8);
        handAnchor.scale.setScalar(Math.max(0.001, handCurrentScale));

        const targetY = state === 'spinning' ? 5.2 : 0.14;
        const targetX = state === 'spinning' ? 1.5 : 0.04;
        spinSpeedY += (targetY - spinSpeedY) * Math.min(1, dt * 5.5);
        spinSpeedX += (targetX - spinSpeedX) * Math.min(1, dt * 5.5);
        spinGroup.rotation.y += spinSpeedY * dt;
        spinGroup.rotation.x += spinSpeedX * dt;
        ring1.rotation.z += (0.5 + spinSpeedY * 0.45) * dt;
        ring2.rotation.z -= (0.35 + spinSpeedY * 0.35) * dt;

        const othersOpacity = state === 'locked' ? 0.2 : 0.96;
        for (let i = 0; i < nameSprites.length; i++) {
          nameSprites[i].sprite.material.opacity += (othersOpacity - nameSprites[i].sprite.material.opacity) * Math.min(1, dt * 7);
        }
        winnerSprite.material.opacity += (winnerOpacityTarget - winnerSprite.material.opacity) * Math.min(1, dt * 9);

        if (state === 'spinning' && handCurrentScale > 0.3) magicAudio.playTick();

        // 3. 选中爆发粒子
        if (burstLife > 0) {
          burstLife = Math.max(0, burstLife - dt * 1.25);
          bMat.opacity = burstLife;
          for (let i = 0; i < BURST_N; i++) {
            bPos[i * 3] += bVel[i].x * dt;
            bPos[i * 3 + 1] += bVel[i].y * dt;
            bPos[i * 3 + 2] += bVel[i].z * dt;
            bVel[i].multiplyScalar(0.96);
          }
          bGeo.attributes.position.needsUpdate = true;
        } else bMat.opacity = 0;

        // 4. 背景飘浮紫金魔法星尘
        for (let i = 0; i < AMBIENT_N; i++) {
          ambPos[i * 3 + 1] += ambSpeed[i] * dt;
          ambPos[i * 3] += Math.sin(elapsed * 0.8 + i) * 0.08 * dt;
          if (ambPos[i * 3 + 1] > 4.5) ambPos[i * 3 + 1] = -4.5;
        }
        ambGeo.attributes.position.needsUpdate = true;

        renderer.render(scene, camera);
      }

      // ==================== 启动摄像头 + 双模型交替流畅识别 ====================
      async function startExperience() {
        startBtn.disabled = true;
        startBtn.textContent = '正在唤醒魔法...';
        errorMsg.textContent = '';
        try {
          magicAudio.init();
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error('请通过 http://localhost 或 HTTPS 网址打开以使用摄像头');
          }
          if (typeof window.Hands === 'undefined' || typeof window.FaceMesh === 'undefined') {
            throw new Error('AI 视觉模型未加载完成，请检查网络后重试');
          }
          let stream;
          try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
          catch (_) { stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); }
          videoEl.srcObject = stream;
          await videoEl.play();

          const hands = new window.Hands({ locateFile: (file) => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + file });
          hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.65, minTrackingConfidence: 0.6 });
          hands.onResults(onHandsResults);

          const faceMesh = new window.FaceMesh({ locateFile: (file) => 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/' + file });
          faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: false, minDetectionConfidence: 0.55, minTrackingConfidence: 0.55 });
          faceMesh.onResults(onFaceResults);

          // 交替送帧给手势与人脸模型，既流畅又省电
          let busy = false;
          let toggle = 0;
          async function detectLoop() {
            if (videoEl.readyState >= 2 && !busy) {
              busy = true;
              try {
                if (toggle % 2 === 0) await hands.send({ image: videoEl });
                else if (showHat) await faceMesh.send({ image: videoEl });
                toggle++;
              } catch (_) {}
              busy = false;
            }
            requestAnimationFrame(detectLoop);
          }
          detectLoop();

          startOverlay.classList.add('hidden');
          hudEl.classList.add('visible');
          hintBar.classList.add('visible');
        } catch (err) {
          startBtn.disabled = false;
          startBtn.textContent = '重试开启魔法摄像头';
          errorMsg.textContent = err && err.message ? err.message : '无法打开摄像头，请检查权限';
        }
      }

      startBtn.addEventListener('click', startExperience);
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
